[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=1.0.0"]

[tool.poetry]
authors = ["Maximilien Naveau <maximilien.naveau@gmail.com>"]
description = "Thin Python REST client for the compotes API"
license = "BSD-2-Clause"
name = "compotes-rest-client"
packages = [{include = "compotes_rest_client"}]
version = "0.1.0"

[tool.poetry.dependencies]
python = "^3.10"
requests = "^2.32"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
responses = "^0.25"
ruff = "^0.15.9"

[tool.tomlsort]
all = true
