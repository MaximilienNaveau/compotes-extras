version: "0.5"

# Real prod-style topology (no Docker, no toy dev server): gunicorn, fronted
# by Traefik via its *file* provider - the Nix-based equivalent of what
# compotes' own docker-compose.yml does with Docker labels + Traefik's
# Docker provider.
#
#   nix run .#prod           # foreground, TUI - or `nix run .#prod -- up -D` detached
#   nix run .#prod -- down   # stop
#
# (symmetric with the dev recipe, process-compose.yaml / `nix run .#dev` -
# see the root README's "Nix packaging" section.) apps.prod sets $FLAKE_SRC
# (this repo's own source - where traefik.yml/dynamic.yml live) and puts
# gunicorn/traefik/process-compose on PATH itself, same as apps.dev does
# for the dev recipe - no `nix develop` needed. No $COMPOTES_SRC/manage.py
# either: compotes is just an installed Python package here (see
# flake.nix), so gunicorn imports `compotes.wsgi:application` directly,
# with DJANGO_SETTINGS_MODULE pointed at the compotes_extras_site module
# that wires the REST API in (compotes.wsgi's own
# `os.environ.setdefault(...)` only takes effect if this isn't already set).
#
# If your real deployment already has its own Traefik running elsewhere
# (the common case - "nix and a traefik environment exists" already,
# nothing to spin up here): skip the `traefik` process below entirely
# (`nix run .#prod -- up migrate gunicorn`) and copy dynamic.yml into that
# Traefik's own file-provider-watched directory instead - see prod/README.md.
# The `traefik` process here is only for testing dynamic.yml actually
# works before you do that.
#
# Same $$ escaping as process-compose.yaml - see its comments for why
# (process-compose interpolates $-patterns in command strings itself,
# before bash ever sees them).
#
# KNOWN GAP, not solved here: gunicorn never serves /static or /media
# itself - see .env.example's note on DEBUG for why this setup doesn't try
# to and what to add (nginx, whitenoise, ...) before relying on this for
# real.

processes:
  migrate:
    command: |
      set -eu
      data_dir="$${CHATONS_ROOT_DIR:-/tmp}/compotes/$${APP_NAME:-prod}"
      mkdir -p "$$data_dir"
      DB="$${DB:-$$data_dir/db.sqlite3}" \
      python -m django migrate --settings=compotes_extras_site.settings
    availability:
      restart: "no"

  gunicorn:
    command: |
      data_dir="$${CHATONS_ROOT_DIR:-/tmp}/compotes/$${APP_NAME:-prod}"
      # Bound to 127.0.0.1, not 0.0.0.0: the whole point of this example is
      # that Traefik is the only public entrypoint, matching how `app` in
      # docker-compose.yml has no host port mapping of its own either.
      DB="$${DB:-$$data_dir/db.sqlite3}" \
      DJANGO_SETTINGS_MODULE=compotes_extras_site.settings \
      gunicorn compotes.wsgi:application --bind "127.0.0.1:$${APP_PORT:-8000}"
    depends_on:
      migrate:
        condition: process_completed_successfully

  traefik:
    command: |
      cd "$$FLAKE_SRC"
      traefik --configFile=./traefik.yml
    depends_on:
      gunicorn:
        condition: process_started
