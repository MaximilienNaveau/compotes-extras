version: "0.5"

# Local dev instance for the full stack (compotes + compotes_rest_api,
# assembled by packages/rest_api/pyproject.toml - see flake.nix). Uses
# settings.py's sqlite backend by default. No manage.py/$COMPOTES_SRC
# needed: compotes is just an installed Python package here, so `python -m
# django` (with --settings pointed at the compotes_extras_site module that
# wires the REST API in) does everything manage.py would.
#
# Parametrized via .env (loaded automatically from the CWD) or the shell
# environment - see .env.example for the full list. Anything settings.py
# itself reads from the environment (SECRET_KEY, DEBUG, DB, POSTGRES_*,
# ALLOWED_HOST, DOMAIN_NAME, ...) passes through untouched.
#
# APP_NAME/PORT/CHATONS_ROOT_DIR below are specific to this process-compose
# setup, not to compotes. CHATONS_ROOT_DIR matches compotes' own
# docker-compose.yml, which roots every persistent volume under
# ${CHATONS_ROOT_DIR:-/srv/chatons}/compotes/... - same variable here, so
# prod/ can point it at /srv/chatons and match production exactly, but
# defaulting to /tmp instead of /srv/chatons since a normal user can't
# write to /srv without root.
#
# Every $ below is doubled ($$) on purpose: process-compose does its own
# docker-compose-style $${VAR}/$$VAR interpolation on command strings
# *before* bash ever sees them, and silently replaces anything it doesn't
# understand (including bash's own ${VAR:-default} fallback syntax, and
# even locally-assigned shell variables referenced on a later line) with
# an empty string instead of leaving it alone. $$ is process-compose's
# escape sequence for a literal, unprocessed $ - verified empirically that
# without it, ${APP_NAME:-dev} silently becomes "" instead of "dev".

processes:
  migrate:
    command: |
      set -eu
      data_dir="$${CHATONS_ROOT_DIR:-/tmp}/compotes/$${APP_NAME:-dev}"
      mkdir -p "$$data_dir"
      DB="$${DB:-$$data_dir/db.sqlite3}" \
      python -m django migrate --settings=compotes_extras_site.settings
    availability:
      restart: "no"

  runserver:
    command: |
      data_dir="$${CHATONS_ROOT_DIR:-/tmp}/compotes/$${APP_NAME:-dev}"
      DB="$${DB:-$$data_dir/db.sqlite3}" \
      python -m django runserver "0.0.0.0:$${PORT:-8000}" --settings=compotes_extras_site.settings
    depends_on:
      migrate:
        condition: process_completed_successfully
