version: "0.5"

# Real prod-style topology (no Docker, no toy dev server): gunicorn, fronted
# by Traefik via its *file* provider - the Nix-based equivalent of what
# compotes' own docker-compose.yml does with Docker labels + Traefik's
# Docker provider. Run from this directory (nix develop's prod shell sets
# $COMPOTES_SRC and puts gunicorn/process-compose/traefik on PATH; this
# dir's own process-compose.yaml is found by default, no -f needed):
#   nix develop ../..#prod          # or: nix develop github:MaximilienNaveau/compotes-extras#prod
#   process-compose up -D
#
# If your real deployment already has its own Traefik running elsewhere
# (the common case - "nix and a traefik environment exists" already,
# nothing to spin up here): skip the `traefik` process below entirely
# (`process-compose up migrate gunicorn`) and copy dynamic.yml into that
# Traefik's own file-provider-watched directory instead - see README.md.
# The `traefik` process here is only for testing dynamic.yml actually
# works before you do that.
#
# Same $$ escaping as the root process-compose.yaml - see its comments for
# why (process-compose interpolates $-patterns in command strings itself,
# before bash ever sees them).
#
# KNOWN GAP, not solved here: gunicorn never serves /static or /media
# itself (unlike manage.py runserver under DEBUG=True) - see
# .env.example's note on DEBUG for why this setup doesn't try to and what
# to add (nginx, whitenoise, ...) before relying on this for real.

processes:
  migrate:
    command: |
      set -eu
      data_dir="$${CHATONS_ROOT_DIR:-/tmp}/compotes/$${APP_NAME:-traefik-example}"
      mkdir -p "$$data_dir"
      cd "$$COMPOTES_SRC"
      DB="$${DB:-$$data_dir/db.sqlite3}" python manage.py migrate
    availability:
      restart: "no"

  gunicorn:
    command: |
      cd "$$COMPOTES_SRC"
      data_dir="$${CHATONS_ROOT_DIR:-/tmp}/compotes/$${APP_NAME:-traefik-example}"
      # Bound to 127.0.0.1, not 0.0.0.0: the whole point of this example is
      # that Traefik is the only public entrypoint, matching how `app` in
      # docker-compose.yml has no host port mapping of its own either.
      DB="$${DB:-$$data_dir/db.sqlite3}" \
      gunicorn compotes.wsgi:application --bind "127.0.0.1:$${APP_PORT:-8000}"
    depends_on:
      migrate:
        condition: process_completed_successfully

  traefik:
    command: traefik --configFile=./traefik.yml
    depends_on:
      gunicorn:
        condition: process_started
